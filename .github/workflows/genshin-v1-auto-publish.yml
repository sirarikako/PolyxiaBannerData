# 正式发布入口：仅导入已经持久化的官方候选与人工配置，不联网抓公告或 OCR。
# 失败由 GitHub 原生邮件通知；业务异常由 Issue 通知。v1 改动后显式 dispatch Manifest。
name: 2-2_原神每日V1数据自动发布
on:
  workflow_run:
    workflows:
      - '2-1_原神公告每日自动采集与解析'
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'manual/genshin_*.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: genshin-v1-publish-main
  cancel-in-progress: false

jobs:
  verify-upstream:
    runs-on: ubuntu-26.04
    outputs:
      should_publish: ${{ steps.gate.outputs.should_publish }}
    steps:
      - name: 确认 2-1 确实完成了公告处理
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # Prevent manual dispatch from a feature/test ref publishing checkout ref: main.
          if [ "${GITHUB_REF:-}" != 'refs/heads/main' ]; then
            echo 'should_publish=false' >> "$GITHUB_OUTPUT"
            echo '非 main 分支，拒绝执行正式 v1 发布。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$EVENT_NAME" in workflow_run|workflow_dispatch|push) ;; *)
            echo 'should_publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          esac
          # 手动触发、版本人工配置变更仍直接进入发布。
          if [ "$EVENT_NAME" != 'workflow_run' ]; then
            echo 'should_publish=true' >> "$GITHUB_OUTPUT"
            echo '手动触发或版本人工配置变更：允许检查发布。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 防止其他仓库或非 main 上游触发具有写入权限的正式发布。
          if [ "$UPSTREAM_REPOSITORY" != "$GITHUB_REPOSITORY" ] || [ "$UPSTREAM_HEAD_BRANCH" != 'main' ]; then
            echo 'should_publish=false' >> "$GITHUB_OUTPUT"
            echo '上游仓库或分支与生产 main 不一致，本轮拒绝发布。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$UPSTREAM_CONCLUSION" != 'success' ]; then
            echo 'should_publish=false' >> "$GITHUB_OUTPUT"
            echo '2-1 未成功完成，不执行 2-2。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 2-1 的 check-pending 成功不代表真正执行了 collect-and-preview。
          # 仅当该作业确实成功，才允许执行 V1 发布；无 pending 时它会被跳过。
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID/jobs?per_page=100" --paginate --jq '.jobs[] | select(.name == "collect-and-preview") | .conclusion')"
          if grep -Fxq 'success' <<< "$jobs"; then
            echo 'should_publish=true' >> "$GITHUB_OUTPUT"
            echo '2-1 采集整合作业执行成功，允许 2-2。' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'should_publish=false' >> "$GITHUB_OUTPUT"
            echo '2-1 没有成功的采集整合作业（通常为无 pending 而跳过），本轮无需发布。' >> "$GITHUB_STEP_SUMMARY"
          fi
  publish:
    needs: verify-upstream
    if: needs.verify-upstream.outputs.should_publish == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 安装正式数据校验依赖
        run: python -m pip install -r requirements.txt
      - name: 逐池导入、验证并提交（冲突时重新计算新 ID）
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python -m scripts.release.import_genshin_v1_zh_cn --isolate-invalid --write > /tmp/genshin-v1-publish.json
            python -m scripts.release.validate_v1 --datasets-only
            # 发布中间态的新 V1 与旧 Manifest SHA 必然不相等。
            # 在 Runner 临时重算 Manifest，再进行完整合约/哈希验证。
            python -m scripts.release.refresh_v1_manifest > /tmp/genshin-manifest-validation-preview.log
            python -m scripts.release.validate_v1 --public
            # 2-2 只提交 V1/人工状态；Manifest 的正式提交仍由 1-1 管理。
            git restore -- public/v1/manifest.json

            git add -A -- public/v1/genshin.json
            git add -A -- 'manual/genshin_*.json'
            if git diff --cached --quiet; then
              echo "v1_changed=false" >> "$GITHUB_OUTPUT"
              echo "没有新的合法发布变更。" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            if git diff --cached --quiet -- public/v1/genshin.json; then
              v1_changed=false
            else
              v1_changed=true
            fi
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m '自动导入原神公告候选与版本人工数据'
            if git push origin HEAD:main; then
              echo "v1_changed=$v1_changed" >> "$GITHUB_OUTPUT"
              echo "本轮提交已进入私有仓库；公开发布仍需 Manifest 校验与同步。" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::重算三次仍无法推送；拒绝覆盖 main"
              exit 1
            fi
          done
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          d = json.loads(Path("/tmp/genshin-v1-publish.json").read_text())
          print("## 原神 v1 自动导入")
          print(f"- 追加池数：{len(d['appended'])}")
          print(f"- 修订已有池：{len(d['updatedExistingIds'])}")
          print(f"- 人工条目结清：{len(d['completedManual'])}")
          print(f"- 待人工复核条目：{len(d['rejected'])}")
          for item in d["rejected"]:
              print(f"  - {item.get('postId') or item.get('id') or item.get('file')}: {item.get('error')}")
          PY
      - name: 显式触发 Manifest 刷新（不依赖机器人 push）
        if: steps.publish.outputs.v1_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh-v1-manifest.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: 发布业务问题以 Issue 通知
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            python -m scripts.release.notify_genshin_v1_publication
          else
            python -m scripts.release.notify_genshin_v1_publication --failure
          fi
      - name: 保存发布报告
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: genshin-v1-publish-report
          path: /tmp/genshin-v1-publish.json
          if-no-files-found: ignore
          retention-days: 30
