name: P2 staging validation (read-only)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装测试依赖
        run: python -m pip install -r requirements-dev.txt
      - name: v1 与 Manifest 合约校验
        run: python -m scripts.release.validate_v1 --public
      - name: 检查现役 Python 语法
        run: python -m compileall -q scripts/collect scripts/transform scripts/release
      - name: 隔离回归测试（不访问官网、不写正式 v1）
        run: |
          python -m pytest -q \
            tests/test_p2_public_staging.py \
            tests/test_p3_no_persisted_raw.py \
            tests/test_collect_genshin_notices_zh_cn.py \
            tests/test_collect_genshin_notice_image_refresh_zh_cn.py \
            tests/test_genshin_notice_manual_zh_cn.py \
            tests/test_starrail_collector_notifier_zh_cn.py \
            tests/test_notify_genshin_notice_problems.py \
            tests/test_notice_fullscan_schedule.py \
            tests/test_v1.py \
            tests/test_import_genshin_v1_zh_cn.py \
            tests/test_starrail_import_zh_cn.py \
            tests/test_genshin_missing_notices_zh_cn.py \
            tests/test_genshin_manual_postmerge_integration.py \
            tests/test_starrail_notice_scenarios_zh_cn.py
      - name: P3 单次真实官方详情与 OCR 隔离探针（无 Git/Artifact 写入）
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('deploy/migration/p3-live-once.flag') != '' }}
        shell: bash
        timeout-minutes: 8
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-chi-sim
          PYTHONPATH=. python tests/p3_live_official_probe.py
      - name: 严格确认排除项和生产部署隔离
        shell: bash
        run: |
          set -euo pipefail
          test -f deploy/production/workflows/genshin-v1-auto-publish.yml
          test -f deploy/production/workflows/starrail-v1-auto-publish.yml
          test ! -f .github/workflows/genshin-v1-auto-publish.yml
          test ! -f .github/workflows/starrail-v1-auto-publish.yml
          test ! -d data/derived/genshin/archive
          test ! -d data/review
          test ! -d data/announcements/genshin/zh-cn/miyoushe/images
          test ! -f data/announcements/genshin/zh-cn/miyoushe/index.json
          test ! -f data/announcements/genshin/zh-cn/miyoushe/checkpoint.json
          test ! -d data/announcements/genshin/zh-cn/miyoushe/posts
          test ! -d data/announcements/starrail/zh-cn/miyoushe/posts
          ! grep -Fq 'git add -A -- data/announcements' deploy/production/workflows/genshin-notices-zh-cn-daily-preview.yml
          ! grep -Fq 'git add -A -- data/announcements' deploy/production/workflows/starrail-notices-zh-cn-daily-preview.yml
