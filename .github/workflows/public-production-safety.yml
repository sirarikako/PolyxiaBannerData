name: Public production safety validation (read-only)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装测试依赖
        run: python -m pip install -r requirements-dev.txt
      - name: v1 与 Manifest 合约校验
        run: python -m scripts.release.validate_v1 --public
      - name: 检查现役 Python 语法
        run: python -m compileall -q scripts/collect scripts/transform scripts/release
      - name: 隔离回归测试（不访问官网、不写正式 v1）
        run: |
          python -m pytest -q \
            tests/test_public_repository_safety.py \
            tests/test_no_persisted_raw.py \
            tests/test_public_archive_write_guard.py \
            tests/test_deleted_official_notice_recovery.py \
            tests/test_public_artifact_guard.py \
            tests/test_no_raw_end_to_end.py \
            tests/test_collect_genshin_notices_zh_cn.py \
            tests/test_collect_genshin_notice_image_refresh_zh_cn.py \
            tests/test_genshin_notice_manual_zh_cn.py \
            tests/test_starrail_collector_notifier_zh_cn.py \
            tests/test_notify_genshin_notice_problems.py \
            tests/test_notice_fullscan_schedule.py \
            tests/test_production_workflow_names.py \
            tests/test_v1.py \
            tests/test_import_genshin_v1_zh_cn.py \
            tests/test_starrail_import_zh_cn.py \
            tests/test_genshin_missing_notices_zh_cn.py \
            tests/test_genshin_manual_postmerge_integration.py \
            tests/test_starrail_notice_scenarios_zh_cn.py
      - name: 严格确认原文排除项与正式工作流
        shell: bash
        run: |
          set -euo pipefail
          for name in official-item-mappings-daily.yml refresh-v1-manifest.yml genshin-notices-zh-cn-daily-preview.yml genshin-v1-auto-publish.yml starrail-notices-zh-cn-daily-preview.yml starrail-v1-auto-publish.yml; do
            test -f ".github/workflows/$name"
          done
          test ! -d data/derived/genshin/archive
          test ! -d data/review
          test ! -d data/announcements/genshin/zh-cn/miyoushe/images
          test ! -f data/announcements/genshin/zh-cn/miyoushe/index.json
          test ! -f data/announcements/genshin/zh-cn/miyoushe/checkpoint.json
          test ! -d data/announcements/genshin/zh-cn/miyoushe/posts
          test ! -d data/announcements/starrail/zh-cn/miyoushe/posts
          ! grep -Fq 'git add -A -- data/announcements' .github/workflows/genshin-notices-zh-cn-daily-preview.yml
          ! grep -Fq 'git add -A -- data/announcements' .github/workflows/starrail-notices-zh-cn-daily-preview.yml
