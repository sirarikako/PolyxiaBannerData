# 3-1：星铁公告增量采集和候选预览；不更新正式 V1 或 Manifest。
name: 3-1_星铁公告每日自动采集与解析
on:
  schedule:
    - cron: '17 7 * * *'         # 北京时间 15:17，完整增量扫描
    - cron: '27,37,47,57 7 * * *' # 北京时间 15:27/37/47/57，均完整增量扫描
  push:
    branches: [main]
    paths:
      - 'manual/notices/starrail/zh-CN/**'
  workflow_dispatch:
    inputs:
      retry_only:
        description: '只重新处理 pending，不扫描新公告'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: starrail-notice-zh-cn-daily
  cancel-in-progress: false

jobs:
  check-pending:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: 允许本轮采集
        id: gate
        shell: bash
        run: |
          # 定时完整扫描无需提前检查 pending；checkpoint 由采集器自己管理。
          echo 'should_run=true' >> "$GITHUB_OUTPUT"
          echo '星铁定时均完整增量扫描；手动 retry_only 仅处理 pending。' >> "$GITHUB_STEP_SUMMARY"

  collect-and-preview:
    needs: check-pending
    if: needs.check-pending.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 增量采集、候选整合、预览并提交私有数据
        env:
          EVENT_NAME: ${{ github.event_name }}
          RETRY_ONLY: ${{ inputs.retry_only }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # bot push 冲突后不能复用上一次未跟踪的临时候选，必须重新计算。
            git clean -fd -- data/announcements/starrail data/derived/starrail
            sha256sum public/v1/starrail.json > /tmp/starrail-v1-before.sha256
            if [ "$EVENT_NAME" = "push" ]; then
              echo "人工星铁公告文件变更：只重新组装"
            elif [ "$RETRY_ONLY" = "true" ]; then
              python -m scripts.collect.collect_starrail_notices_zh_cn --retry-only
            else
              python -m scripts.collect.collect_starrail_notices_zh_cn --max-pages 15
            fi
            # 无持久 raw：只对人工引用、缺少可信结构化来源的官方文章临时补抓。
            python -m scripts.collect.recover_manual_raw_zh_cn --game starrail
            python -m scripts.transform.assemble_starrail_warp_candidates_zh_cn > /tmp/starrail-v1-readiness.json
            python -m scripts.release.import_starrail_v1_zh_cn --isolate-invalid > /tmp/starrail-v1-preview.json
            sha256sum -c /tmp/starrail-v1-before.sha256
            git add -A -- data/derived/starrail
            # 原文仅用于本轮采集，不提交到公开 Git 历史。
            if git diff --cached --quiet; then
              echo "未发现新的公告候选变更"
              break
            fi
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '自动保存星铁公告和逐池候选'
            if git push origin HEAD:main; then
              echo "公告数据已进入私有仓库；正式星铁 V1 未改"
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::三次重新计算仍无法推送，拒绝覆盖 main"
              exit 1
            fi
          done
      - name: 发布 Issue 人工复核通知
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.collect.notify_starrail_notice_problems
      - name: 保存结果
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: starrail-notices-preview
          path: |
            /tmp/starrail-v1-readiness.json
            /tmp/starrail-v1-preview.json
            data/derived/starrail/notice-discovery/*report.json
          if-no-files-found: ignore
          retention-days: 30
